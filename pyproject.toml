[project]
name = "Local vLLM Agent"
version = "0.1.0"
description = "An interactive web app featuring an AI agent. It uses LangChain for the agent's brain and workflows, and vLLM as the engine to run the model smoothly without overloading the system."
authors = [
    {name = "Konstantinos Dalageorgos",email = "kon.dalageorgos@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11 < 3.12"
dependencies = [
    "vllm (>=0.17.1,<0.18.0)",
    "ipykernel (>=7.2.0,<8.0.0)",
    "geopy (>=2.4.1,<3.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "mistral-common (>=1.8.6)",
    "langchain-openai (<1.1.11)",
    "langchain (>=1.2.12,<2.0.0)",
    "ddgs (>=9.11.3,<10.0.0)",
    "fastapi (>=0.115.0,<1.0.0)",
    "uvicorn[standard] (>=0.41.0,<0.42.0)",
    "sse-starlette (>=2.2.0,<3.0.0)"
]

[tool.poetry]
package-mode=false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
